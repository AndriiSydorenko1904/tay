services:
  tay:
    image: ${TAY_DASHBOARD_IMAGE:-ghcr.io/andriisydorenko1904/tay-dashboard:0.11.3}
    build:
      context: ../..
      dockerfile: Dockerfile.dashboard
    environment:
      TAY_DATA_DIR: /var/lib/tay/store
      TAY_SOCKET_PATH: /run/tay/tay.sock
      TAY_INITIALIZE_IF_MISSING: "true"
      TAY_DASHBOARD_HOST: localhost
      TAY_DASHBOARD_PORT: "4000"
      TAY_DASHBOARD_SECRET_KEY_BASE: ${TAY_DASHBOARD_SECRET_KEY_BASE:-development-only-secret-key-base-change-this-before-production-000000}
    ports:
      - "127.0.0.1:${TAY_DASHBOARD_HTTP_PORT:-4000}:4000"
    volumes:
      - taydata:/var/lib/tay
      - taysocket:/run/tay
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ../..
      dockerfile: examples/standalone/worker.Dockerfile
    environment:
      TAY_SOCKET_PATH: /run/tay/tay.sock
    depends_on:
      tay:
        condition: service_healthy
    volumes:
      - taysocket:/run/tay
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  taydata:
  taysocket:
