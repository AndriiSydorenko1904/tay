name: Dashboard container

on:
  pull_request:
    paths:
      - Dockerfile.dashboard
      - .dockerignore
      - dashboard/**
      - standalone/**
      - examples/dashboard/**
      - lib/**
      - mix.exs
      - mix.lock
  push:
    branches: [main]
    paths:
      - Dockerfile.dashboard
      - .dockerignore
      - dashboard/**
      - standalone/**
      - examples/dashboard/**
      - lib/**
      - mix.exs
      - mix.lock

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          version-type: strict
          install-rebar: false
      - name: Test the dashboard package and build its documentation
        working-directory: dashboard
        run: |
          mix deps.get --check-locked
          mix format --check-formatted
          mix test --warnings-as-errors
          mix docs --warnings-as-errors
          TAY_DASHBOARD_PACKAGE=1 mix hex.build
      - name: Test and build the dashboard-enabled release
        working-directory: dashboard/standalone
        run: |
          mix deps.get --check-locked
          mix format --check-formatted
          mix test --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors
          MIX_ENV=prod mix release tay_dashboard_standalone
      - name: Build the dashboard-enabled image
        run: docker build --file Dockerfile.dashboard --tag tay-dashboard:test .
      - name: Exercise Engine readiness and authenticated HTTP
        run: dashboard/standalone/test/container_smoke.sh tay-dashboard:test
