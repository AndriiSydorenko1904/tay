name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ERL_FLAGS: "+S 4:4 +A 4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.5"
          version-type: strict
          install-rebar: false
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Audit dependencies
        run: mix hex.audit
      - name: Verify core
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix dialyzer
          mix test --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors

  python:
    name: Python client ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, node24
      - name: Lint and type-check client
        if: matrix.python == '3.13'
        run: |
          uv run --with ruff ruff check clients/python bench/soak.py
          uv run --with ruff ruff format --check clients/python bench/soak.py
          uv run --with mypy --with cryptography mypy clients/python/tay
      - name: Test client
        run: uv run --with pytest pytest clients/python
      - name: Test release report comparison
        if: matrix.python == '3.13'
        run: python -m unittest discover -s bench -p 'test_*.py'

  node:
    name: Node.js client ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - name: Install locked dependencies
        working-directory: clients/node
        run: npm ci
      - name: Type-check and test client
        working-directory: clients/node
        run: |
          npm run check
          npm test
      - name: Verify npm package
        if: matrix.node == '24'
        working-directory: clients/node
        run: npm run pack:check
