name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elixir:
    name: Elixir core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ERL_FLAGS: "+S 4:4 +A 4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 security backports
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.2"
          elixir-version: "1.20.2"
          version-type: strict
          install-rebar: false
      - name: Install locked dependencies
        run: mix deps.get --check-locked
      - name: Verify core
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors

  python:
    name: Python client
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 security backports
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Verify client
        run: |
          uv run --with ruff ruff check clients/python
          uv run --with ruff ruff format --check clients/python
          uv run --with pytest pytest clients/python
