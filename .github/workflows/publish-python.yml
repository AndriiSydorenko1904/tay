name: Publish Python client

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.0.0-rc.1
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Python client release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      previous_tag: ${{ steps.changes.outputs.previous_tag }}
    steps:
      - name: Check out release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect client changes
        id: changes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mix_version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"/\1/p' mix.exs)
          test -n "$mix_version"
          test "$RELEASE_TAG" = "v$mix_version"

          previous_tag=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"

          if test -n "$previous_tag" && git diff --quiet "$previous_tag..$RELEASE_TAG" -- clients/python; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Python client is unchanged since $previous_tag; skipping publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish tay-client
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/tay-client/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PREVIOUS_TAG: ${{ needs.changes.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mix_version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"/\1/p' mix.exs)
          test -n "$mix_version"
          test "$RELEASE_TAG" = "v$mix_version"
          package_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("clients/python/pyproject.toml").read_text())["project"]["version"])')
          python - "$package_version" <<'PY'
          import re
          import sys

          if re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", sys.argv[1]) is None:
              raise SystemExit(f"unsupported Python client version: {sys.argv[1]}")
          PY

          if test -n "$PREVIOUS_TAG"; then
            previous_version=$(git show "$PREVIOUS_TAG:clients/python/pyproject.toml" 2>/dev/null | sed -n 's/^[[:space:]]*version = "\([^"]*\)"/\1/p')
            test -z "$previous_version" || test "$package_version" != "$previous_version"
          fi

      - name: Qualify Python client
        run: |
          uv run --with ruff ruff check clients/python
          uv run --with ruff ruff format --check clients/python
          uv run --with pytest pytest clients/python

      - name: Build distributions
        run: |
          uv build clients/python
          uv run --with twine twine check clients/python/dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: clients/python/dist/
