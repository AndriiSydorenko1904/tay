name: Publish Python client

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v1.0.0-rc.1
        required: true
        type: string

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Python client release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      previous_tag: ${{ steps.changes.outputs.previous_tag }}
      release_commit: ${{ steps.changes.outputs.release_commit }}
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect client changes
        id: changes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mix_version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"/\1/p' mix.exs)
          test -n "$mix_version"
          test "$RELEASE_TAG" = "v$mix_version"
          printf 'release_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          previous_tag=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"

          if test -n "$previous_tag" && git diff --quiet "$previous_tag..$RELEASE_TAG" -- clients/python; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Python client is unchanged since $previous_tag; skipping publication."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  qualification:
    name: Verify release CI
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.changes.outputs.release_commit }}
          persist-credentials: false

      - name: Verify CI and standalone for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse HEAD)
          for workflow in ci.yml standalone.yml; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$release_commit" --event push --status success --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq "[.[] | select(.headSha == \"$release_commit\" and .conclusion == \"success\")][0].databaseId // empty")
            test -n "$run_id" || { echo "Release refused: $workflow must pass for $release_commit" >&2; exit 1; }
            echo "$workflow passed for $release_commit (run $run_id)"
          done

  publish:
    name: Build and publish tay-client
    needs: [changes, qualification]
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/tay-client/
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Check out the qualified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ needs.changes.outputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI and standalone for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse HEAD)
          for workflow in ci.yml standalone.yml; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$release_commit" --event push --status success --limit 20 \
              --json databaseId,headSha,conclusion \
              --jq "[.[] | select(.headSha == \"$release_commit\" and .conclusion == \"success\")][0].databaseId // empty")
            test -n "$run_id" || { echo "Release refused: $workflow must pass for $release_commit" >&2; exit 1; }
            echo "$workflow passed for $release_commit (run $run_id)"
          done

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, node24
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, node24

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PREVIOUS_TAG: ${{ needs.changes.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mix_version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"/\1/p' mix.exs)
          test -n "$mix_version"
          test "$RELEASE_TAG" = "v$mix_version"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
          package_version=$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("clients/python/pyproject.toml").read_text())["project"]["version"])')
          python - "$package_version" <<'PY'
          import re
          import sys

          if re.fullmatch(r"\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?", sys.argv[1]) is None:
              raise SystemExit(f"unsupported Python client version: {sys.argv[1]}")
          PY

          if test -n "$PREVIOUS_TAG"; then
            previous_version=$(git show "$PREVIOUS_TAG:clients/python/pyproject.toml" 2>/dev/null | sed -n 's/^[[:space:]]*version = "\([^"]*\)"/\1/p')
            test -z "$previous_version" || test "$package_version" != "$previous_version"
          fi

      - name: Qualify Python client
        run: |
          uv run --with ruff ruff check clients/python
          uv run --with ruff ruff format --check clients/python
          uv run --with mypy --with cryptography mypy clients/python/tay
          uv run --with pytest pytest clients/python

      - name: Build distributions
        run: |
          uv build clients/python
          uv run --with twine twine check clients/python/dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: clients/python/dist/
