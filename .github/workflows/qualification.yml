name: Tay qualification (not publication)

# Expensive qualification is intentional and explicit, not repeated on every edit.
on:
  workflow_dispatch:
    inputs:
      performance_only:
        description: Run only release performance comparison
        type: boolean
        default: false
      baseline_ref:
        description: Previous release to compare using the same benchmark script
        type: string
        default: v1.7.0
      performance_jobs:
        description: Synthetic jobs per benchmark trial (1..100000)
        type: string
        default: "10000"
      fail_on_regression:
        description: Fail when a median metric degrades by more than 20 percent
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  qualify:
    if: ${{ !inputs.performance_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ERL_FLAGS: "+S 4:4 +A 4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 security backports
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1, node24
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
          version-type: strict
          install-rebar: false
      - name: Install locked test dependency
        run: mix deps.get --check-locked
      - name: Create disposable Linux local Btrfs qualification filesystem
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs clang libclang-rt-dev file procps
          qualification_dir=$(mktemp -d "$RUNNER_TEMP/tay-btrfs.XXXXXX")
          test -d "$qualification_dir"
          image_path="$qualification_dir/qualification.img"
          mount_path="$qualification_dir/data"
          test ! -e "$image_path"
          mkdir "$mount_path"
          truncate -s 8G "$image_path"
          mkfs.btrfs "$image_path"
          sudo mount -o loop "$image_path" "$mount_path"
          sudo chown "$(id -u):$(id -g)" "$mount_path"
          test "$(stat -f -c %T "$mount_path")" = btrfs
          printf 'TAY_TEST_DATA_ROOT=%s\nTAY_TEST_SYNC=1\n' "$mount_path" >> "$GITHUB_ENV"
          findmnt -T "$mount_path"
      - name: Versions and ordinary verification
        run: |
          elixir --version
          cc --version
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors
      - name: Sanitized native and ordinary matrix
        env:
          TAY_NATIVE_SANITIZE: "1"
          MIX_BUILD_PATH: _build/sanitized-qualification
        run: mix test --warnings-as-errors
      - name: Fuzz the production CRC32C core with ASan and UBSan
        run: bash c_src/fuzz_crc32c.sh
      - name: Full retained-history scale qualification
        env:
          TAY_LARGE_SEGMENT_TEST: "1"
          TAY_LARGE_RECOVERY_TEST: "1"
        run: >-
          mix test test/tay/storage/segment_large_test.exs
          test/tay/engine/large_recovery_test.exs --warnings-as-errors
      - name: Detached consuming application and production release
        env:
          TAY_PACKAGE_TEST: "1"
        run: mix test test/tay/system/package_test.exs --warnings-as-errors

      - name: Phase-C bounded automatic compaction default workloads
        env:
          TAY_PHASE_C_WORKLOAD: "1"
        run: >-
          mix test test/tay/engine/compaction_runtime_test.exs
          --only phase_c_workload --warnings-as-errors

      - name: Phase-C 10000-job automatic retention and headroom qualification
        env:
          TAY_PHASE_C_10000: "1"
          TAY_PHASE_C_HEADROOM: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: >-
          mix test test/tay/engine/compaction_runtime_test.exs
          --only phase_c_10000 --warnings-as-errors

# These disposable hosted-runner tests are software evidence, not hardware
# power-loss certification or release approval. No publish credentials/actions.


  performance:
    needs: qualify
    if: ${{ always() && (inputs.performance_only || needs.qualify.result == 'success') }}
    name: Release comparison (${{ matrix.os }}, replica ${{ matrix.replica }})
    concurrency:
      group: release-performance-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Keep arm64 functional/sanitizer coverage above. Hosted arm64 macOS
        # showed common-mode timing swings even with serialized workloads;
        # use an explicit standard Intel profile for comparative performance.
        os: [ubuntu-24.04, macos-15-intel]
        replica: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ERL_FLAGS: "+S 2:2 +A 2"
      BASELINE_REF: ${{ inputs.baseline_ref }}
      PERFORMANCE_JOBS: ${{ inputs.performance_jobs }}
      FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
          version-type: strict
          install-rebar: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Prepare isolated baseline and report directory
        shell: bash
        run: |
          set -euo pipefail
          baseline_commit=$(git rev-parse --verify --end-of-options "$BASELINE_REF^{commit}")
          git worktree add --detach "$RUNNER_TEMP/tay-baseline" "$baseline_commit"
          mkdir "$GITHUB_WORKSPACE/performance"
          root=$(mktemp -d "$RUNNER_TEMP/tay-performance.XXXXXX")
          echo "PERFORMANCE_ROOT=$root" >> "$GITHUB_ENV"
          getconf _NPROCESSORS_ONLN
          elixir --version
      - name: Create disposable local Btrfs for strict Linux measurements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes btrfs-progs
          truncate -s 8G "$PERFORMANCE_ROOT/data.img"
          mkfs.btrfs "$PERFORMANCE_ROOT/data.img"
          mkdir "$PERFORMANCE_ROOT/data"
          sudo mount -o loop "$PERFORMANCE_ROOT/data.img" "$PERFORMANCE_ROOT/data"
          sudo chown "$(id -u):$(id -g)" "$PERFORMANCE_ROOT/data"
          test "$(stat -f -c %T "$PERFORMANCE_ROOT/data")" = btrfs
      - name: Measure baseline and candidate with identical harness and workload
        shell: bash
        run: |
          set -euo pipefail
          mode=write
          root="$PERFORMANCE_ROOT"
          if [ "$RUNNER_OS" = Linux ]; then
            mode=sync
            root="$PERFORMANCE_ROOT/data"
          fi
          for cohort in baseline candidate; do
            checkout="$GITHUB_WORKSPACE"
            if [ "$cohort" = baseline ]; then checkout="$RUNNER_TEMP/tay-baseline"; fi
            (
              cd "$checkout"
              mix deps.get --check-locked
              mix compile --warnings-as-errors
            )
          done
          arguments=(--baseline "$RUNNER_TEMP/tay-baseline" --candidate "$GITHUB_WORKSPACE"
            --harness "$GITHUB_WORKSPACE/bench/release.exs" --data-root "$root/release-comparison"
            --output-dir "$GITHUB_WORKSPACE/performance" --mode "$mode"
            --jobs "$PERFORMANCE_JOBS" --clients 8 --trials 8)
          if [ "$RUNNER_OS" = Linux ]; then arguments+=(--validated-filesystem); fi
          python bench/release_compare.py "${arguments[@]}"
      - name: Compare medians and optional regression threshold
        shell: bash
        run: |
          set -euo pipefail
          arguments=(--output performance/comparison.json --markdown performance/comparison.md)
          if [ "$FAIL_ON_REGRESSION" = true ]; then arguments+=(--fail-on-regression); fi
          python bench/compare.py performance/baseline.json performance/candidate.json "${arguments[@]}"
      - name: Add comparison to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f performance/comparison.md ]; then cat performance/comparison.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve benchmark reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-performance-${{ matrix.os }}-${{ matrix.replica }}-${{ github.sha }}
          path: |
            performance/*.json
            performance/*.md
          if-no-files-found: warn
          retention-days: 30

  release_gate:
    name: Release qualification gate
    needs: [qualify, performance]
    if: ${{ always() && !inputs.performance_only && inputs.fail_on_regression }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every platform and regression check
        env:
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PERFORMANCE_JOBS: ${{ inputs.performance_jobs }}
        run: |
          test "$QUALIFICATION_RESULT" = success
          test "$PERFORMANCE_RESULT" = success
          test "$PERFORMANCE_JOBS" -ge 10000
